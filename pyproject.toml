[project]
name = "regime-aware-distributional-rl"
version = "1.0.0"
description = "Reproducibility code for regime-aware distributional reinforcement learning in commodity spread trading"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "torch==2.1.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.13.1",
    "statsmodels==0.14.4",
    "gymnasium==1.0.0",
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
